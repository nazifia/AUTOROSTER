{% extends 'roster/base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card">
      <div class="card-header" style="background:#1B4F72;color:#fff;">
        <i class="fas fa-layer-group me-2"></i>{{ title }}
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% crispy form %}
        </form>
      </div>
    </div>
    <div class="mt-3">
      <a href="{% url 'unit_list' %}" class="text-muted text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i> Back to Units
      </a>
    </div>
  </div>
</div>
{% endblock %}
